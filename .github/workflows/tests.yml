name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.14'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build installable wheel
        run: python -m pip wheel --wheel-dir wheelhouse .
      - name: Install distribution
        run: python -m pip install --no-index --find-links wheelhouse skill-dist-check
      - name: Unit tests against installed package
        run: python -m unittest discover -s tests -v
      - name: Installed CLI end-to-end cases
        run: python scripts/smoke.py
      - name: Rebuild synthetic demo
        run: python scripts/demo.py
      - name: Check reproducible demo
        run: git diff --exit-code -- docs
